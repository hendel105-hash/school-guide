function evalSchool(s,A){
  var reg=A[0],mode=A[1],thr=[75,55,45][A[2]],ux=A[6],c=s.c[reg];

  else { if(c<thr){ if(s.dorm)c=60; else return null; } }
  var it=intensity(s),margin=ux-s.cut;
  if(s.sel&&margin<-15)return null;
  var secure=clamp((100-it)*.6+clamp(50+margin*3)*.4);
  var kf=[.8,1,1.25][A[7]];
  var bonusSci=(A[4]===0&&s.sci)?5:0;
  var studyB=s.study+(A[3]===2&&s.dorm?5:0)+(A[3]===1?(s.lv-60)*.1:0);
  var susiB=s.susi+(A[5]===0?4:0);
  return {s:s,c:c,it:it,margin:margin,secure:Math.round(secure),
    g:{
      commute:.6*c+.2*secure+.2*studyB,

}

  var A=ans,list=[];
  S.forEach(function(s){var r=evalSchool(s,A);if(r)list.push(r)});
  var order=[A[8],0,1,2].filter(function(v,i,a){return a.indexOf(v)===i});
  var mode=["순수 통학","기숙사 선호","통학·기숙 모두"][A[1]];
  var h='<div class="sum"><h2>진단 결과</h2><p>거주 '+esc(REG[A[0]])+' · '+mode+' · 가내신 '+(A[6]>=197?"195점 이상":A[6]<=148?"154점 이하":esc(Q[6].o.filter(function(o){return o[1]===A[6]})[0][0]))+'</p><p>조건에 맞는 학교 '+list.length+'곳을 세 가지 우선순위로 정리했습니다. 학교를 누르면 상세 정보가 열립니다.</p></div>';
  order.forEach(function(gi){
    var g=GN[gi];
    var sorted=list.slice().sort(function(a,b){return b.g[g.k]-a.g[g.k]}).slice(0,4);
    h+='<section class="grp"><h3>'+esc(g.t)+(gi===A[8]?'<span class="mine">내 1순위</span>':'')+'</h3><p class="d">'+esc(g.d)+'</p>';
    if(!sorted.length)h+='<div class="empty">선택하신 조건(거주지·등하교 방식·통학 시간)에 맞는 학교가 없습니다. 통학 시간을 늘리거나 등하교 방식을 바꿔 다시 진단해 보세요.</div>';
    sorted.forEach(function(r,i){
      var f=fit(r.margin,r.s.sel);
      h+='<button type="button" class="sch" data-id="'+r.s.id+'"><span class="rk">'+(i+1)+'</span><span><b>'+esc(r.s.n)+'</b><small>'+esc(r.s.loc)+' · 통학 적합 '+Math.round(r.c)+' · 내신 확보 '+r.secure+' · 경쟁 강도 '+r.it+'</small>'+
        (r.s.tag?'<span class="tg">'+esc(r.s.tag)+'</span>':'')+'<span class="tg '+f[1]+'">내 성적 기준 '+f[0]+'</span></span>'+
        '<span class="pill"><strong>'+Math.round(r.g[g.k])+'</strong>종합</span></button>';
    });
    h+='</section>';
  });
  h+='<p class="note">※ 학교별 수치(전교생 수, 합격 점수, 입학생 수준, 최소성취수준 미도달 비율, 성비 등)는 이 앱의 분석용 추정치입니다. 평준화 지역 일반고는 추첨 배정이라 합격 점수가 실제 입학선과 다를 수 있으므로, 지원 전 학교알리미와 경기도교육청 최신 공시, 학교 설명회로 반드시 확인하세요.</p><div class="nav"><button type="button" class="btn" id="redo">처음부터 다시 진단</button></div>';
  main.innerHTML=h;
  window.scrollTo(0,0);
}

function openModal(id){
  var s=null;for(var i=0;i<S.length;i++)if(S[i].id===id)s=S[i];
  if(!s)return;
  var it=intensity(s),ux=ans[6],m=ux-s.cut,f=fit(m,s.sel);
  lastFocus=document.activeElement;
  mdl.innerHTML='<button type="button" class="x" id="mx" aria-label="닫기">×</button><h2>'+esc(s.n)+'</h2>'+
  '<div>'+(s.tag?'<span class="tg">'+esc(s.tag)+'</span>':'')+'<span class="tg b">'+esc(s.loc)+'</span><span class="tg '+f[1]+'">내 성적 기준 '+f[0]+' ('+(m>=0?"+":"")+m+'점)</span></div>'+
  '<div class="grid">'+
  '<div><span>전교생 수</span>약 '+s.st+'명</div>'+
  '<div><span>전년도 합격 점수(200점 만점)</span>'+s.cut+'점</div>'+
  '<div><span>입학생 학업 수준</span>'+s.lv+' / 100</div>'+
  '<div><span>최소성취수준 미도달 학생 비율</span>약 '+s.ne+'%</div>'+
  '<div><span>남녀 학생 비율 (남 : 여)</span>'+esc(s.mf)+'</div>'+
  '<div><span>문·이과 반 구성 비율</span>'+esc(s.tr)+'</div>'+
  '<div class="w"><span>실질 내신 경쟁 강도 · '+intLabel(it)+' ('+it+' / 100)</span><div class="gauge"><i style="width:'+it+'%"></i></div></div>'+
  '<div class="w"><span>핵심 특색 프로그램 및 교육과정</span>'+esc(s.pg)+'</div></div>'+
  '<p class="note" style="margin-top:8px">경쟁 강도는 입학생 학업 수준, 지역 학력 격차, 최소성취수준 미도달 비율을 함께 반영한 값입니다. 수치는 추정치이므로 공식 공시로 재확인하세요.</p>';
  ov.classList.add("show");
  $("mx").focus();
}
function closeModal(){
  ov.classList.remove("show");
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}

/* ── 이벤트 ── */
main.addEventListener("click",function(e){
  var t=e.target;
  var o=t.closest?t.closest(".opt"):null;
  if(o){pick(parseInt(o.getAttribute("data-i"),10));return}
  var sc=t.closest?t.closest(".sch"):null;
  if(sc){openModal(sc.getAttribute("data-id"));return}
  if(t.id==="back"&&idx>0){idx--;render();return}
  if(t.id==="redo"){idx=0;ans=[];render()}
});
ov.addEventListener("click",function(e){if(e.target===ov||e.target.id==="mx")closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ov.classList.contains("show"))closeModal()});

render();
})();
</script>
</body>
</html>
